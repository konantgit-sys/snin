name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography aiojson pytest

      - name: ESP32 smoke test
        run: |
          cd hardware/esp32
          python test_smoke.py

      - name: LoRa self-test
        run: python hardware/esp32/lora/lora_phy.py

      - name: BLE self-test
        run: python hardware/esp32/ble/ble_phy.py

      - name: Simulator self-test
        run: |
          cd hardware/esp32
          PYTHONPATH=../.. python sim/sim_sensor.py --self-test

  test-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check all imports
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from hardware.esp32.sdk.transport import TCPTransport, TransportMessage
          from hardware.esp32.bridge.bridge import ESPNowBridge
          from hardware.esp32.relay.device_handler import DeviceHandler
          from hardware.esp32.lora.lora_phy import SX1278Transport, PacketFragmenter
          from hardware.esp32.ble.ble_phy import BLEBridge, BLECommandHandler
          from hardware.esp32.mdns.mdns_discovery import MDnsAnnouncer, AutoBridgeConnector
          from hardware.raspberry.raspberry_node import RPiNode
          from hardware.display.display_module import PCDisplaySimulator
          print('✅ All 18 imports OK')
          "

  test-fragmenter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fragmenter edge cases
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from hardware.esp32.lora.lora_phy import PacketFragmenter as PF
          
          # Edge: пустой пакет
          f = PF.fragment(b'')
          assert PF.defragment(f) == b''
          print('✅ Empty packet')
          
          # Edge: 1 байт
          f = PF.fragment(b'x')
          assert PF.defragment(f) == b'x'
          print('✅ 1 byte')
          
          # Edge: ровно 60 байт
          f = PF.fragment(b'a' * 60)
          assert PF.defragment(f) == b'a' * 60
          print('✅ 60 bytes (1 fragment)')
          
          # Edge: 61 байт (требует 2 фрагмента)
          f = PF.fragment(b'a' * 61)
          assert PF.defragment(f) == b'a' * 61
          print('✅ 61 bytes (2 fragments)')
          
          # Edge: повреждённый CRC
          f = PF.fragment(b'test')
          f[0] = f[0][:3] + b'\xff' + f[0][4:]  # битый CRC
          assert PF.defragment([f[0]]) is None
          print('✅ CRC rejection')
          
          print('\\n✅ ALL FRAGMENTER EDGE CASES PASSED')
          "

  test-arduino-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.1 2>/dev/null || true
      - name: Compile check
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 \
            hardware/arduino/src/snin_arduino.ino \
            2>&1 | tail -5 || echo '⚠️ Compile skipped (lib deps)'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linter
        run: |
          pip install flake8
      - name: Run flake8
        run: |
          flake8 --max-line-length=100 --extend-ignore=E501,F401,E402 \
            hardware/esp32/ hardware/raspberry/ hardware/display/
